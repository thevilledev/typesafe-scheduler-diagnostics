apiVersion: v1
kind: ConfigMap
metadata:
  name: typesafe-scheduler-config
  namespace: typesafe-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
    - schedulerName: typesafe-scheduler
      plugins:
        postFilter:
          disabled:
          - name: DefaultPreemption
          enabled:
          - name: TypeSafeDiagnosis
          - name: DefaultPreemption
